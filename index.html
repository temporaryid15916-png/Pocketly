<!DOCTYPE html>
<html lang="en" data-pocketly="standalone">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17392f">
<meta name="color-scheme" content="light dark">
<meta name="description" content="POCKETLY — Smart Money. Better Life. A private, offline-first personal money manager.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="POCKETLY">
<title>POCKETLY — Smart Money. Better Life.</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
@import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Outfit:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap");

/* =========================================================
   POCKETLY — Premium Hybrid Fintech Design System
   Warm ivory / cream · Deep forest green · Emerald · Midnight navy
   ========================================================= */

#pocketly {
  /* Light (default premium) */
  --bg: #f7f4ec;
  --bg-soft: #f0ebe0;
  --panel: #fffcf7;
  --panel-2: #f4efe6;
  --line: rgba(23, 57, 47, 0.10);
  --line-strong: rgba(23, 57, 47, 0.16);
  --text: #14241c;
  --muted: #5c6f64;
  --forest: #17392f;
  --forest-2: #0f2a22;
  --emerald: #2d8b68;
  --emerald-soft: #e8f5ef;
  --navy: #0e1c34;
  --blue: #3a7bd5;
  --blue-soft: #e8f0fb;
  --amber: #c98a1a;
  --amber-soft: #faf0dc;
  --red: #c45b66;
  --red-soft: #fbecee;
  --green: #2d8b68;
  --shadow: 0 12px 32px rgba(20, 40, 30, 0.07);
  --shadow-lg: 0 20px 48px rgba(20, 40, 30, 0.10);
  --radius: 18px;
  --radius-sm: 12px;
  --radius-lg: 24px;
  --sans: "Outfit", "Noto Sans Bengali", "Segoe UI", system-ui, sans-serif;
  --display: "Fraunces", Georgia, "Noto Serif Bengali", serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  min-height: 100vh;
  min-height: 100dvh;
  color: var(--text);
  background:
    radial-gradient(900px 480px at 100% -8%, rgba(45, 139, 104, 0.08), transparent 55%),
    radial-gradient(700px 400px at -10% 30%, rgba(58, 123, 213, 0.05), transparent 50%),
    var(--bg);
  font-family: var(--sans);
  font-size: 15.5px;
  line-height: 1.5;
  overflow-x: clip;
  -webkit-font-smoothing: antialiased;
}

#pocketly[data-theme="dark"] {
  --bg: #0c1612;
  --bg-soft: #121f1a;
  --panel: #15241e;
  --panel-2: #1b2e26;
  --line: rgba(200, 230, 210, 0.10);
  --line-strong: rgba(200, 230, 210, 0.16);
  --text: #e8f0ea;
  --muted: #8fa89a;
  --forest: #1a4a3a;
  --forest-2: #0f2a22;
  --emerald: #3caf82;
  --emerald-soft: rgba(60, 175, 130, 0.14);
  --navy: #0a1420;
  --blue: #5a9aef;
  --blue-soft: rgba(90, 154, 239, 0.12);
  --amber: #e0a83a;
  --amber-soft: rgba(224, 168, 58, 0.14);
  --red: #e07a84;
  --red-soft: rgba(224, 122, 132, 0.14);
  --green: #3caf82;
  --shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 22px 50px rgba(0, 0, 0, 0.45);
  background:
    radial-gradient(900px 480px at 100% -8%, rgba(60, 175, 130, 0.10), transparent 55%),
    radial-gradient(700px 400px at -10% 30%, rgba(90, 154, 239, 0.06), transparent 50%),
    var(--bg);
}

#pocketly * { box-sizing: border-box; }
#pocketly button, #pocketly input, #pocketly select, #pocketly textarea { font: inherit; color: inherit; }
#pocketly button { cursor: pointer; border: 0; background: none; }
#pocketly button:disabled { opacity: 0.5; cursor: default; }
#pocketly :focus-visible { outline: 2px solid var(--emerald); outline-offset: 2px; }
#pocketly h1, #pocketly h2, #pocketly h3, #pocketly p { margin: 0; }
#pocketly .muted { color: var(--muted); }
#pocketly .stack { display: grid; gap: 14px; }
#pocketly svg { display: block; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* ---- Layout ---- */
#pocketly .app {
  width: 100%;
  min-width: 0;
  min-height: 100dvh;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
}
#pocketly .sidebar {
  display: none;
  background: linear-gradient(180deg, var(--forest) 0%, var(--forest-2) 100%);
  color: #e8f0ea;
  padding: 24px 18px 18px;
  flex-direction: column;
  gap: 20px;
}
#pocketly .main {
  min-width: 0;
  padding: 18px 16px calc(88px + var(--safe-b));
  max-width: 920px;
  width: 100%;
  margin: 0 auto;
}
#pocketly .content { display: grid; min-width: 0; gap: 16px; }

/* ---- Brand ---- */
#pocketly .brand { display: flex; gap: 12px; align-items: center; padding: 0 6px; }
#pocketly .brand b { display: block; letter-spacing: 0.12em; font-size: 13px; font-weight: 700; }
#pocketly .brand small { color: #9ab5a8; font-size: 11px; }
#pocketly .brand .mark {
  width: 42px;
  height: 42px;
  flex: 0 0 42px;
  display: block;
  overflow: hidden;
  padding: 0;
  border-radius: 14px;
  line-height: 0;
}

#pocketly .brand .mark img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  border-radius: inherit;
}

/* ---- Nav (sidebar) ---- */
#pocketly .nav { display: grid; gap: 4px; }
#pocketly .nav-btn {
  display: flex; align-items: center; gap: 10px;
  color: #b7cfc4; border-radius: 12px;
  padding: 11px 12px; font-weight: 600; font-size: 14px;
  transition: background 0.15s, color 0.15s;
}
#pocketly .nav-btn:hover { background: rgba(255,255,255,0.06); color: #fff; }
#pocketly .nav-btn.active { background: rgba(60, 175, 130, 0.22); color: #fff; }
#pocketly .nav-btn svg, #pocketly .tab svg, #pocketly .quick svg, #pocketly .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
#pocketly .nav-btn .badge, #pocketly .tab .badge {
  margin-left: auto; background: var(--red); color: white;
  border-radius: 99px; min-width: 18px; height: 18px;
  font-size: 11px; display: grid; place-items: center; padding: 0 5px;
}
#pocketly .side-foot { margin-top: auto; display: grid; gap: 10px; }
#pocketly .side-note {
  font-size: 12px; line-height: 1.5; color: #9ab5a8;
  background: rgba(60, 175, 130, 0.10);
  border: 1px solid rgba(60, 175, 130, 0.18);
  border-radius: 12px; padding: 12px;
}
#pocketly .who {
  display: flex; gap: 10px; align-items: center;
  color: #e8f0ea; padding: 8px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.08);
}
#pocketly .avatar {
  width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center;
  background: #3caf82; color: white; font-weight: 700; font-size: 14px;
}

/* ---- Top bar ---- */
#pocketly .top {
  display: flex; justify-content: space-between; gap: 12px;
  align-items: flex-end; margin-bottom: 4px;
}
#pocketly .eyebrow {
  color: var(--muted); font-size: 11px; letter-spacing: 0.12em;
  font-weight: 700; text-transform: uppercase;
}
#pocketly .top h1 {
  font-family: var(--display); font-size: 26px; font-weight: 560;
  letter-spacing: -0.02em; line-height: 1.15;
}
#pocketly .top-actions {
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap; justify-content: flex-end;
}
#pocketly .top-actions .btn { min-height: 40px; padding: 9px 12px; font-size: 12px; }

/* ---- Buttons ---- */
#pocketly .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border-radius: 12px; padding: 11px 16px; font-weight: 600; font-size: 14px;
  border: 1px solid transparent; min-height: 44px;
  transition: transform 0.12s, box-shadow 0.12s, background 0.15s;
}
#pocketly .btn:active { transform: scale(0.98); }
#pocketly .btn.primary {
  background: linear-gradient(135deg, #2d8b68, #236d55);
  color: #fff; box-shadow: 0 6px 16px rgba(35, 109, 85, 0.28);
}
#pocketly .btn.primary:hover { box-shadow: 0 8px 20px rgba(35, 109, 85, 0.35); }
#pocketly .btn.ghost {
  background: var(--panel-2); border-color: var(--line); color: var(--text);
}
#pocketly .btn.ghost:hover { border-color: var(--line-strong); }
#pocketly .btn.danger {
  background: var(--red-soft); color: var(--red); border-color: rgba(196, 91, 102, 0.25);
}
#pocketly .btn.block { width: 100%; }
#pocketly .btn.install-btn {
  background: var(--emerald-soft); color: var(--forest);
  border-color: rgba(45, 139, 104, 0.25); font-weight: 700;
}
#pocketly[data-theme="dark"] .btn.install-btn {
  background: rgba(60, 175, 130, 0.18); color: #b8e6d0; border-color: rgba(60, 175, 130, 0.3);
}
#pocketly .install-state {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--emerald); font-size: 12px; font-weight: 700; padding: 9px;
}
#pocketly .link {
  background: none; border: 0; color: var(--emerald); font-weight: 600;
  font-size: 13px; padding: 0; cursor: pointer;
}

/* ---- Cards & panels ---- */
#pocketly .panel, #pocketly .hero, #pocketly .metric {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
#pocketly .panel { padding: 16px; display: grid; gap: 12px; }
#pocketly .panel h2 {
  font-family: var(--display); font-size: 18px; font-weight: 560;
  letter-spacing: -0.01em;
}
#pocketly .ph {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
}
#pocketly .hero {
  padding: 22px 20px;
  background:
    linear-gradient(145deg, rgba(45, 139, 104, 0.08), transparent 60%),
    var(--panel);
  border-radius: var(--radius-lg);
  display: grid; gap: 14px;
}
#pocketly .hero .balance-label {
  font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted);
}
#pocketly .hero .balance {
  font-family: var(--display); font-size: 36px; font-weight: 680;
  letter-spacing: -0.03em; line-height: 1.1; color: var(--forest);
}
#pocketly[data-theme="dark"] .hero .balance { color: #b8e6d0; }
#pocketly .hero .sub-row {
  display: flex; flex-wrap: wrap; gap: 16px;
  font-size: 13px; color: var(--muted);
}
#pocketly .hero .sub-row b { color: var(--text); font-weight: 700; }
#pocketly .today-pair {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
#pocketly .today-pair > div {
  background: var(--panel-2); border-radius: var(--radius-sm);
  padding: 12px; display: grid; gap: 4px;
}
#pocketly .today-pair span { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
#pocketly .today-pair strong { font-size: 17px; font-weight: 700; }

/* ---- Metrics ---- */
#pocketly .metrics {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
}
#pocketly .metric {
  padding: 14px; display: grid; gap: 6px;
}
#pocketly .metric span { font-size: 12px; font-weight: 600; color: var(--muted); }
#pocketly .metric strong {
  font-family: var(--display); font-size: 20px; font-weight: 560;
  letter-spacing: -0.02em;
}

/* ---- Progress ---- */
#pocketly .progress {
  height: 8px; border-radius: 99px; background: var(--panel-2); overflow: hidden;
}
#pocketly .progress i {
  display: block; height: 100%; border-radius: inherit;
  background: linear-gradient(90deg, #3caf82, #2d8b68);
  transition: width 0.3s ease;
}
#pocketly .progress i.hot {
  background: linear-gradient(90deg, #e07a84, #c45b66);
}
#pocketly .split {
  display: flex; justify-content: space-between; align-items: center;
  gap: 8px; font-size: 13px; color: var(--muted);
}
#pocketly .split b { color: var(--text); }

/* ---- Quick actions ---- */
#pocketly .quick {
  display: flex; align-items: center; gap: 12px;
  width: 100%; text-align: left;
  border-radius: 14px; padding: 13px;
  background: var(--panel-2); border: 1px solid var(--line);
  transition: border-color 0.15s, background 0.15s;
}
#pocketly .quick:hover { border-color: var(--line-strong); background: var(--panel); }
#pocketly .quick b { display: block; font-size: 14px; font-weight: 700; }
#pocketly .quick small { color: var(--muted); font-size: 12px; }
#pocketly .bubble {
  width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center; flex-shrink: 0;
}
#pocketly .bubble.green { background: var(--emerald-soft); color: var(--emerald); }
#pocketly .bubble.red { background: var(--red-soft); color: var(--red); }
#pocketly .bubble.blue { background: var(--blue-soft); color: var(--blue); }

/* ---- Transactions ---- */
#pocketly .tx {
  display: grid; grid-template-columns: auto 1fr auto;
  gap: 12px; align-items: center;
  padding: 12px 0; border-bottom: 1px solid var(--line);
}
#pocketly .tx:last-child { border-bottom: 0; }
#pocketly .tx b { font-size: 14px; font-weight: 600; display: block; }
#pocketly .tx small { color: var(--muted); font-size: 12px; }
#pocketly .tx .amount { font-weight: 700; font-size: 14px; text-align: right; white-space: nowrap; }
#pocketly .tx .amount.pos { color: var(--emerald); }
#pocketly .tx .amount.neg { color: var(--red); }
#pocketly .tx .row-actions {
  grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end;
}
#pocketly .day-label {
  font-size: 12px; color: var(--muted); font-weight: 700;
  margin-top: 8px; padding-top: 4px;
}

/* ---- Empty states ---- */
#pocketly .empty {
  display: grid; gap: 6px; place-items: center; text-align: center;
  padding: 28px 16px; color: var(--muted);
  background: var(--panel-2); border-radius: var(--radius-sm);
  border: 1px dashed var(--line-strong);
}
#pocketly .empty strong { color: var(--text); font-size: 15px; }
#pocketly .empty span { font-size: 13px; max-width: 280px; }

/* ---- Forms ---- */
#pocketly .toolbar { display: grid; gap: 8px; }
#pocketly .search, #pocketly .field input, #pocketly .field select, #pocketly textarea {
  width: 100%; border-radius: 13px; border: 1px solid var(--line);
  background: var(--panel-2); padding: 12px 14px; outline: none; min-height: 46px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
#pocketly .search:focus-within, #pocketly .field input:focus, #pocketly .field select:focus, #pocketly textarea:focus {
  border-color: var(--emerald); box-shadow: 0 0 0 3px rgba(45, 139, 104, 0.15);
}
#pocketly textarea { min-height: 80px; resize: vertical; }
#pocketly .search { display: flex; align-items: center; gap: 8px; padding: 0 14px; }
#pocketly .search input { border: 0; background: transparent; padding: 0; min-height: 0; width: 100%; outline: none; }
#pocketly .field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
#pocketly .fields { display: grid; gap: 12px; }
#pocketly .seg {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}
#pocketly .seg button {
  padding: 11px; border-radius: 12px; font-weight: 600;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
}
#pocketly .seg button.on {
  background: var(--emerald-soft); color: var(--forest);
  border-color: rgba(45, 139, 104, 0.35); font-weight: 700;
}
#pocketly[data-theme="dark"] .seg button.on { color: #b8e6d0; }

/* ---- Tab bar (mobile) ---- */
#pocketly .tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px;
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  border-top: 1px solid var(--line);
  padding: 6px 6px calc(8px + var(--safe-b));
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
}
#pocketly .tab {
  display: grid; justify-items: center; gap: 2px;
  font-size: 10px; font-weight: 700; color: var(--muted);
  padding: 4px 0; position: relative;
}
#pocketly .tab.on { color: var(--emerald); }
#pocketly .tab.add { color: white; }
#pocketly .tab.add span.fab {
  width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center;
  background: linear-gradient(135deg, #3caf82, #236d55);
  margin-top: -18px;
  box-shadow: 0 8px 20px rgba(35, 109, 85, 0.35);
}

/* ---- Modals & sheets ---- */
#pocketly .modal-back {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(10, 20, 16, 0.55);
  display: grid; align-items: end; padding: 12px;
  backdrop-filter: blur(4px);
}
#pocketly .modal, #pocketly .sheet {
  background: var(--panel); color: var(--text);
  border-radius: 22px 22px 18px 18px;
  border: 1px solid var(--line);
  padding: 18px; width: min(560px, 100%); margin: 0 auto;
  max-height: min(88dvh, 780px); overflow: auto;
  box-shadow: var(--shadow-lg);
  display: grid; gap: 14px;
}
#pocketly .modal h2, #pocketly .sheet h2 {
  font-family: var(--display); font-weight: 560; font-size: 22px;
  letter-spacing: -0.02em;
}
#pocketly .note { font-size: 13px; line-height: 1.55; color: var(--muted); }
#pocketly .banner {
  background: var(--emerald-soft); border: 1px solid rgba(45, 139, 104, 0.2);
  border-radius: 14px; padding: 12px 14px; font-size: 13px; color: var(--forest);
}
#pocketly[data-theme="dark"] .banner { color: #b8e6d0; }
#pocketly .inline { display: flex; gap: 8px; flex-wrap: wrap; }
#pocketly .inline .btn { flex: 1; min-width: 120px; }

/* ---- Welcome / Lock ---- */
#pocketly .welcome, #pocketly .lock-screen {
  min-height: 100dvh; display: grid; place-items: center;
  padding: 24px 18px calc(24px + var(--safe-b));
}
#pocketly .welcome-card, #pocketly .lock-card {
  width: min(420px, 100%);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  padding: 28px 24px;
  display: grid; gap: 16px;
}
#pocketly .welcome-card .mark { margin: 0 auto; width: 56px; height: 56px; border-radius: 18px; overflow: hidden; line-height: 0; }
#pocketly .welcome-card .mark img { width: 100%; height: 100%; display: block; object-fit: cover; border-radius: inherit; }
#pocketly .welcome-card h1 {
  font-family: var(--display); font-size: 28px; font-weight: 560;
  text-align: center; letter-spacing: -0.02em;
}
#pocketly .welcome-card .lead {
  text-align: center; color: var(--muted); font-size: 14px; line-height: 1.55;
}
#pocketly .lang-switch {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  background: var(--panel-2); border-radius: 12px; padding: 4px;
}
#pocketly .lang-switch button {
  padding: 10px; border-radius: 10px; font-weight: 600; font-size: 13px;
  color: var(--muted);
}
#pocketly .lang-switch button.on {
  background: var(--panel); color: var(--text);
  box-shadow: 0 2px 8px rgba(20,40,30,0.08);
}
#pocketly[data-theme="light"] .lang-switch button.on { background: #fff; }

/* ---- PIN pad ---- */
#pocketly .pad {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  max-width: 280px; margin: 0 auto;
}
#pocketly .pad button {
  aspect-ratio: 1; border-radius: 16px; font-size: 22px; font-weight: 600;
  background: var(--panel-2); border: 1px solid var(--line);
  transition: background 0.12s;
}
#pocketly .pad button:active { background: var(--emerald-soft); }
#pocketly .pin-dots {
  display: flex; gap: 12px; justify-content: center; margin: 8px 0;
}
#pocketly .pin-dots i {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid var(--line-strong); background: transparent;
}
#pocketly .pin-dots i.on { background: var(--emerald); border-color: var(--emerald); }

/* ---- Help overlay ---- */
#pocketly .help-modal { display: grid; gap: 16px; }
#pocketly .help-progress {
  height: 6px; border-radius: 99px; background: var(--panel-2); overflow: hidden;
}
#pocketly .help-progress i {
  display: block; height: 100%; border-radius: inherit;
  background: linear-gradient(90deg, #8bbd87, #2d8b68);
  transition: width 0.25s ease;
}
#pocketly .help-count { font-size: 12px; color: var(--muted); font-weight: 700; }
#pocketly .help-back { z-index: 70; }

/* ---- Toast ---- */
#pocketly .toast {
  position: fixed; left: 50%; bottom: calc(90px + var(--safe-b));
  transform: translateX(-50%);
  background: var(--forest); color: #f0f7f3;
  padding: 12px 20px; border-radius: 14px;
  font-size: 14px; font-weight: 600;
  box-shadow: var(--shadow-lg); z-index: 100;
  max-width: min(360px, 90vw); text-align: center;
  animation: toastIn 0.25s ease;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(12px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* ---- Grid helpers ---- */
#pocketly .grid-2 { display: grid; gap: 12px; }
#pocketly .amount.pos { color: var(--emerald); }
#pocketly .amount.neg { color: var(--red); }

/* ---- Insights / charts placeholders ---- */
#pocketly .bar-row {
  display: grid; grid-template-columns: 56px 1fr 64px; gap: 8px;
  align-items: center; font-size: 12px;
}
#pocketly .bar-track {
  height: 8px; border-radius: 99px; background: var(--panel-2); overflow: hidden;
}
#pocketly .bar-fill {
  height: 100%; border-radius: inherit;
  background: linear-gradient(90deg, #3caf82, #2d8b68);
}

/* ---- Confirm dialog ---- */
#pocketly .confirm-actions { display: flex; gap: 8px; }
#pocketly .confirm-actions .btn { flex: 1; }

/* ---- Desktop ---- */
@media (min-width: 980px) {
  #pocketly .app {
    grid-template-columns: 240px 1fr;
  }
  #pocketly .sidebar {
    display: flex;
    position: sticky; top: 0; height: 100dvh;
  }
  #pocketly .tabbar { display: none; }
  #pocketly .main {
    padding: 28px 36px 40px;
    max-width: 960px;
  }
  #pocketly .content { gap: 18px; }
  #pocketly .metrics { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  #pocketly .grid-2 { grid-template-columns: 1.4fr 1fr; }
  #pocketly .top h1 { font-size: 30px; }
  #pocketly .hero .balance { font-size: 42px; }
  #pocketly .modal-back { align-items: center; }
  #pocketly .modal, #pocketly .sheet { border-radius: 22px; }
}

/* ---- Mobile refinements ---- */
@media (max-width: 600px) {
  #pocketly .main { padding: 14px 13px calc(88px + var(--safe-b)); }
  #pocketly .top { align-items: flex-start; flex-direction: column; gap: 10px; }
  #pocketly .top-actions { width: 100%; justify-content: flex-start; }
  #pocketly .top-actions .help-btn,
  #pocketly .top-actions .install-btn { flex: 1; }
  #pocketly .hero { padding: 18px; border-radius: 20px; }
  #pocketly .hero .balance { font-size: 32px; }
  #pocketly .today-pair { gap: 8px; }
  #pocketly .today-pair div { padding: 10px; }
  #pocketly .today-pair strong { font-size: 15px; }
  #pocketly .metric { padding: 12px; }
  #pocketly .panel { padding: 14px; }
  #pocketly .metrics { gap: 8px; }
}

/* ---- Reduced motion ---- */
@media (prefers-reduced-motion: reduce) {
  #pocketly *, #pocketly *::before, #pocketly *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* Compatibility with existing dash markup */
#pocketly .hero .amount {
  font-family: var(--display); font-size: 36px; font-weight: 680;
  letter-spacing: -0.03em; line-height: 1.1; color: var(--forest);
}

}
#pocketly .hero .eyebrow { margin-bottom: 4px; }
#pocketly .grid-2 .panel { min-height: 0; }
#pocketly .lang-switch button.on { font-weight: 700; }
