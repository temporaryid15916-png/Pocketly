<!DOCTYPE html>
<html lang="en" data-pocketly="standalone">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1730">
<meta name="description" content="POCKETLY — Smart Money. Better Life. A personal pocket money manager.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="POCKETLY">
<title>POCKETLY — Smart Money. Better Life.</title>
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
@import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Outfit:wght@400;500;600;700&display=swap");

#pocketly {
  --bg: #0c1730;
  --panel: #13243f;
  --panel-2: #1a3154;
  --line: rgba(186, 210, 242, 0.16);
  --text: #e8eef8;
  --muted: #93a6c3;
  --blue: #3d8bfd;
  --green: #1fbf8f;
  --amber: #e8a317;
  --red: #e36b76;
  --navy: #0e1c34;
  --shadow: 0 18px 40px rgba(3, 10, 24, 0.28);
  --sans: "Outfit", "Segoe UI", sans-serif;
  --display: "Fraunces", Georgia, serif;
  min-height: 100vh;
  min-height: 100dvh;
  color: var(--text);
  background:
    radial-gradient(900px 420px at 100% -10%, rgba(61, 139, 253, 0.18), transparent 55%),
    var(--bg);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.45;
  overflow-x: clip;
}
#pocketly[data-theme="light"] {
  --bg: #f3f6fb;
  --panel: #ffffff;
  --panel-2: #f4f7fb;
  --line: rgba(16, 36, 68, 0.1);
  --text: #14233c;
  --muted: #5c6e88;
  --shadow: 0 16px 36px rgba(20, 40, 80, 0.08);
  background:
    radial-gradient(820px 380px at 100% -12%, rgba(61, 139, 253, 0.12), transparent 50%),
    var(--bg);
}
#pocketly * { box-sizing: border-box; }
#pocketly button, #pocketly input, #pocketly select { font: inherit; color: inherit; }
#pocketly button { cursor: pointer; }
#pocketly button:disabled { opacity: 0.55; cursor: default; }
#pocketly :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
#pocketly h1, #pocketly h2, #pocketly h3, #pocketly p { margin: 0; }
#pocketly .muted { color: var(--muted); }
#pocketly .stack { display: grid; gap: 12px; }
#pocketly .mark {
  width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center;
  background: linear-gradient(160deg, #6aa7ff, #2f6fe4); color: white;
  font-family: var(--display); font-weight: 680; font-size: 22px;
  box-shadow: 0 8px 20px rgba(47, 111, 228, 0.35);
}
#pocketly .app { min-height: 100dvh; }
#pocketly .sidebar {
  display: none; background: var(--navy); color: #e8eef8; padding: 22px 16px 16px;
  flex-direction: column; gap: 18px;
}
#pocketly .brand { display: flex; gap: 12px; align-items: center; padding: 0 8px; }
#pocketly .brand b { display: block; letter-spacing: 0.14em; font-size: 14px; }
#pocketly .brand small, #pocketly .side-note, #pocketly .who small { color: #9aafc9; }
#pocketly .nav { display: grid; gap: 4px; }
#pocketly .nav-btn, #pocketly .menu-item, #pocketly .quick, #pocketly .who, #pocketly .tab {
  border: 0; background: transparent; text-align: left;
}
#pocketly .nav-btn {
  display: flex; align-items: center; gap: 10px; color: #b7c7dc; border-radius: 12px;
  padding: 11px 12px; font-weight: 600; font-size: 14px;
}
#pocketly .nav-btn svg, #pocketly .tab svg, #pocketly .quick svg, #pocketly .btn svg { width: 18px; height: 18px; }
#pocketly .nav-btn.active { background: rgba(61, 139, 253, 0.18); color: white; }
#pocketly .nav-btn .badge, #pocketly .tab .badge {
  margin-left: auto; background: var(--red); color: white; border-radius: 99px;
  min-width: 18px; height: 18px; font-size: 11px; display: grid; place-items: center; padding: 0 5px;
}
#pocketly .side-foot { margin-top: auto; display: grid; gap: 10px; }
#pocketly .side-note, #pocketly .note {
  font-size: 12px; line-height: 1.5; color: var(--muted);
}
#pocketly .side-note { background: rgba(31, 191, 143, 0.08); border: 1px solid rgba(31, 191, 143, 0.2); border-radius: 12px; padding: 12px; }
#pocketly .who { display: flex; gap: 10px; align-items: center; color: #e8eef8; padding: 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,.08); }
#pocketly .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #3d8bfd; color: white; font-weight: 700; }
#pocketly .main { padding: 18px 16px 0; }
#pocketly .top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-end; margin-bottom: 16px; }
#pocketly .eyebrow { color: var(--muted); font-size: 11px; letter-spacing: 0.14em; font-weight: 700; text-transform: uppercase; }
#pocketly .top h1 { font-family: var(--display); font-size: 28px; font-weight: 560; letter-spacing: -0.03em; }
#pocketly .content { display: grid; gap: 14px; padding-bottom: 108px; }
#pocketly .hero {
  border-radius: 22px; padding: 20px; color: white; display: grid; gap: 16px;
  background:
    radial-gradient(circle at 90% 0%, rgba(140, 186, 255, 0.45), transparent 36%),
    linear-gradient(135deg, #1a3d6e, #102544 58%, #0e2d52);
  box-shadow: var(--shadow);
}
#pocketly .hero .eyebrow, #pocketly .hero .hint { color: #c5d6ee; }
#pocketly .amount { font-family: var(--display); font-weight: 560; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
#pocketly .hero .amount { font-size: clamp(34px, 8vw, 52px); line-height: 1; }
#pocketly .hint { color: var(--muted); font-size: 12px; }
#pocketly .today-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#pocketly .today-pair div { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 12px; }
#pocketly .today-pair strong { display: block; font-size: 18px; margin-top: 4px; font-variant-numeric: tabular-nums; }
#pocketly .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#pocketly .metric, #pocketly .panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 1px 0 rgba(255,255,255,.02);
}
#pocketly .metric { padding: 14px; display: grid; gap: 6px; min-width: 0; }
#pocketly .metric span, #pocketly .k { color: var(--muted); font-size: 12px; }
#pocketly .metric strong { font-size: 18px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
#pocketly .panel { padding: 16px; display: grid; gap: 12px; }
#pocketly .ph { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
#pocketly .ph h2, #pocketly .panel h2, #pocketly .panel h3 { font-size: 16px; font-weight: 650; }
#pocketly .link { border: 0; background: transparent; color: var(--blue); font-weight: 700; font-size: 13px; padding: 0; }
#pocketly .progress { height: 8px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
#pocketly .progress i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #3d8bfd, #1fbf8f); width: 0; }
#pocketly .progress i.hot { background: var(--red); }
#pocketly .split { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }
#pocketly .split b { color: var(--text); }
#pocketly .grid-2 { display: grid; gap: 12px; }
#pocketly .quick { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); }
#pocketly .quick b, #pocketly .quick small { display: block; }
#pocketly .quick small { color: var(--muted); font-size: 12px; }
#pocketly .bubble { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; }
#pocketly .bubble svg { width: 18px; height: 18px; }
#pocketly .bubble.red { background: rgba(227,107,118,.15); color: var(--red); }
#pocketly .bubble.green { background: rgba(31,191,143,.15); color: var(--green); }
#pocketly .bubble.blue { background: rgba(61,139,253,.15); color: var(--blue); }
#pocketly .bubble.amber { background: rgba(232,163,23,.16); color: var(--amber); }
#pocketly .tx { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
#pocketly .tx:last-child { border-bottom: 0; }
#pocketly .tx b { font-weight: 650; font-size: 14px; }
#pocketly .tx small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
#pocketly .amt { font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 13px; }
#pocketly .pos { color: var(--green); }
#pocketly .neg { color: var(--red); }
#pocketly .save { color: var(--blue); }
#pocketly .row-actions { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; }
#pocketly .empty { text-align: center; color: var(--muted); padding: 18px 8px; display: grid; gap: 6px; justify-items: center; }
#pocketly .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 12px; padding: 12px 14px; border: 1px solid transparent; font-weight: 700; font-size: 14px;
  min-height: 44px;
}
#pocketly .btn.primary { background: var(--blue); color: white; }
#pocketly .btn.ghost { background: var(--panel-2); border-color: var(--line); }
#pocketly .btn.danger { background: rgba(227,107,118,.12); color: var(--red); border-color: rgba(227,107,118,.3); }
#pocketly .btn.block { width: 100%; }
#pocketly .toolbar { display: grid; gap: 8px; }
#pocketly .search, #pocketly .field input, #pocketly .field select, #pocketly textarea {
  width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2);
  padding: 12px; outline: none; min-height: 44px;
}
#pocketly textarea { min-height: 72px; resize: vertical; }
#pocketly .search { display: flex; align-items: center; gap: 8px; }
#pocketly .search input { border: 0; background: transparent; padding: 0; min-height: 0; width: 100%; outline: none; }
#pocketly .field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
#pocketly .fields { display: grid; gap: 10px; }
#pocketly .day-label { font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 6px; }
#pocketly .tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px;
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  border-top: 1px solid var(--line); padding: 6px 6px calc(8px + env(safe-area-inset-bottom));
  backdrop-filter: blur(12px);
}
#pocketly .tab { display: grid; justify-items: center; gap: 2px; font-size: 10px; font-weight: 700; color: var(--muted); padding: 4px 0; position: relative; }
#pocketly .tab.on { color: var(--blue); }
#pocketly .tab.add { color: white; }
#pocketly .tab.add span.fab {
  width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--blue); margin-top: -16px;
  box-shadow: 0 8px 16px rgba(61, 139, 253, 0.35);
}
#pocketly .modal-back {
  position: fixed; inset: 0; z-index: 40; background: rgba(5, 12, 24, 0.62);
  display: grid; align-items: end; padding: 12px;
}
#pocketly .modal, #pocketly .sheet {
  background: var(--panel); color: var(--text); border-radius: 20px 20px 16px 16px;
  border: 1px solid var(--line); padding: 16px; width: min(560px, 100%); margin: 0 auto;
  max-height: min(88dvh, 760px); overflow: auto; box-shadow: var(--shadow);
}
#pocketly .modal h2, #pocketly .sheet h2 { font-family: var(--display); font-weight: 560; font-size: 26px; }
#pocketly .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
#pocketly .seg button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 12px; text-align: left; display: grid; gap: 4px; min-height: 72px; }
#pocketly .seg button.on { border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); }
#pocketly .seg small { color: var(--muted); font-size: 12px; }
#pocketly .toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 50;
  background: var(--navy); color: white; border-radius: 999px; padding: 10px 14px; font-size: 13px;
  max-width: min(92vw, 420px); text-align: center;
}
#pocketly .banner { border-radius: 12px; padding: 10px 12px; background: rgba(232, 163, 23, 0.12); color: var(--text); border: 1px solid rgba(232, 163, 23, 0.35); font-size: 13px; }
#pocketly .warn { color: var(--red); font-size: 13px; font-weight: 700; }
#pocketly .good { color: var(--green); font-size: 13px; font-weight: 700; }
#pocketly .welcome, #pocketly .lock {
  min-height: 100dvh; display: grid; align-content: center; gap: 22px; padding: 28px 20px 40px;
}
#pocketly .welcome h1, #pocketly .lock h1 { font-family: var(--display); font-weight: 560; font-size: clamp(36px, 8vw, 58px); letter-spacing: -0.03em; line-height: 1.05; }
#pocketly .lang-switch { display: flex; gap: 8px; }
#pocketly .lang-switch button { border-radius: 999px; border: 1px solid var(--line); background: var(--panel); padding: 8px 12px; min-height: 40px; }
#pocketly .lang-switch button.on { background: var(--navy); color: white; border-color: var(--navy); }
#pocketly[data-theme="light"] .lang-switch button.on { background: #14233c; }
#pocketly .example-card {
  border-radius: 18px; padding: 16px; background: var(--navy); color: #e8eef8;
  display: grid; gap: 8px;
}
#pocketly .example-card b { font-family: var(--display); font-size: 28px; font-weight: 560; }
#pocketly .dots { display: flex; gap: 10px; justify-content: center; margin: 8px 0; }
#pocketly .dots i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--muted); display: block; }
#pocketly .dots i.on { background: var(--blue); border-color: var(--blue); }
#pocketly .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 320px; margin: 0 auto; width: 100%; }
#pocketly .pad button { min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); font-size: 20px; font-weight: 650; }
#pocketly .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
#pocketly .cal i { aspect-ratio: 1; border-radius: 10px; background: var(--panel-2); display: grid; place-items: center; font-style: normal; font-size: 11px; color: var(--muted); }
#pocketly .cal i.spend { background: rgba(61, 139, 253, 0.18); color: var(--text); }
#pocketly .cal i.over { background: rgba(227, 107, 118, 0.2); color: var(--text); }
#pocketly .cal i.today { box-shadow: inset 0 0 0 1.5px var(--blue); }
#pocketly .cols { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; align-items: end; min-height: 140px; }
#pocketly .col { display: grid; gap: 6px; justify-items: center; min-width: 0; }
#pocketly .col-track { height: 110px; width: 100%; display: flex; align-items: end; background: var(--panel-2); border-radius: 8px; overflow: hidden; }
#pocketly .col-track i { display: block; width: 100%; background: var(--blue); border-radius: 8px 8px 0 0; }
#pocketly .col-track i.alt { background: var(--green); }
#pocketly .col span { font-size: 10px; color: var(--muted); text-align: center; }
#pocketly .linechart { width: 100%; height: 120px; }
#pocketly .linechart polyline { fill: none; stroke: var(--blue); stroke-width: 2.5; }
#pocketly .donut-wrap { display: grid; gap: 12px; }
#pocketly .donut { width: min(180px, 46vw); margin: 0 auto; transform: rotate(-90deg); }
#pocketly .legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
#pocketly .legend li { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
#pocketly .legend i { width: 10px; height: 10px; border-radius: 50%; display: block; }
#pocketly .legend b { font-variant-numeric: tabular-nums; }
#pocketly .hbar { display: grid; gap: 6px; }
#pocketly .hbar-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
#pocketly .goal-top { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
#pocketly .menu { display: grid; gap: 8px; }
#pocketly .menu-item { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); min-height: 52px; font-weight: 650; }
#pocketly .set-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
#pocketly .set-row:last-child { border-bottom: 0; }
#pocketly .check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
#pocketly .err { color: var(--red); font-size: 13px; min-height: 1em; }
#pocketly .inline { display: flex; gap: 8px; }
#pocketly .inline input { flex: 1; }
@media (min-width: 980px) {
  #pocketly .app { display: grid; grid-template-columns: 252px minmax(0, 1fr); }
  #pocketly .sidebar { display: flex; position: sticky; top: 0; height: 100dvh; }
  #pocketly .main { padding: 28px 32px 40px; max-width: 1080px; }
  #pocketly .content { padding-bottom: 24px; }
  #pocketly .tabbar { display: none; }
  #pocketly .metrics { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  #pocketly .grid-2 { grid-template-columns: 1.3fr 0.7fr; }
  #pocketly .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  #pocketly .toolbar { grid-template-columns: 1.4fr repeat(3, minmax(0, .7fr)); }
  #pocketly .fields.two { grid-template-columns: 1fr 1fr; }
  #pocketly .modal-back { align-items: center; }
  #pocketly .welcome { grid-template-columns: minmax(0, 460px) minmax(260px, 380px); justify-content: center; gap: 48px; padding: 40px; }
  #pocketly .donut-wrap { grid-template-columns: 200px 1fr; align-items: center; }
}
@media (prefers-reduced-motion: reduce) {
  #pocketly * { transition: none !important; animation: none !important; }
}

</style>
</head>
<body>
<div id="pocketly"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
